<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Notes App</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Poppins, sans-serif;
    background: #0f0f1a;
    color: #fff;
  }
  header {
    text-align: center;
    padding: 20px;
    background: #1a1a2e;
  }
  h1 { color: #9a4dff; }.container { max-width: 900px; margin: 20px auto; padding: 20px; }

.inputBox { background: #1b1b2d; padding: 15px; border-radius: 10px; margin-bottom: 20px; } textarea { width: 100%; height: 100px; border: none; outline: none; padding: 10px; border-radius: 8px; resize: none; font-size: 15px; background: #26263d; color: #fff; } button { margin-top: 10px; padding: 10px 20px; background: #9a4dff; border: none; border-radius: 8px; color: #fff; cursor: pointer; }

.notesList { margin-top: 20px; } .note { background: #1b1b2d; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #9a4dff; } .note small { opacity: 0.8; } </style>

</head>
<body>
<header>
  <h1>AI NOTES APP</h1>
</header><div class="container">
  <div class="inputBox">
    <textarea id="noteInput" placeholder="Write your note here..."></textarea>
    <button onclick="addNote()">Save Note</button>
  </div>  <h2>Your Notes</h2>
  <div class="notesList" id="notesList"></div>
</div><script>
  function addNote() {
    let text = document.getElementById('noteInput').value.trim();
    if(text === '') return;

    let notes = JSON.parse(localStorage.getItem('notes') || '[]');
    const newNote = {
      content: text,
      time: new Date().toLocaleString()
    };

    notes.push(newNote);
    localStorage.setItem('notes', JSON.stringify(notes));

    document.getElementById('noteInput').value = '';
    displayNotes();
  }

  function displayNotes() {
    let notes = JSON.parse(localStorage.getItem('notes') || '[]');
    let list = '';

    notes.forEach(n => {
      list += `<div class='note'>
        <p>${n.content}</p>
        <small>${n.time}</small>
      </div>`;
    });

    document.getElementById('notesList').innerHTML = list;
  }

  displayNotes();
</script></body>
</html>
